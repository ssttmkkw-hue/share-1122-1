<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>雾港棋馆</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;900&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/tavern.css">
</head>
<body>
<div id="app">
  <aside id="lb" aria-label="排行榜">
    <div class="lb-head"><span class="lb-title">雾港棋馆</span><span id="lbTurn" class="lb-turn"></span></div>
    <ol id="lbList"></ol>
    <div id="lbTribes" class="lb-tribes"></div>
  </aside>

  <main id="table">
    <header id="tavernBar">
      <div id="recruitCtl" class="bar-group">
        <div id="tierBadge" class="tier-badge" title="酒馆等级"></div>
        <button id="btnUpgrade" class="btn btn-brass" title="升级酒馆 (U)"></button>
        <button id="btnRefresh" class="btn" title="刷新酒馆 (R)"></button>
        <button id="btnFreeze" class="btn btn-ice" title="冻结酒馆 (F)"></button>
      </div>
      <div id="oppCtl" class="bar-group opp" hidden></div>
      <div class="bar-spacer"></div>
      <button id="btnLib" class="btn btn-ghost" title="卡牌图鉴">图鉴</button>
      <button id="btnHelp" class="btn btn-ghost" title="规则说明">规则</button>
      <button id="btnSet" class="btn btn-ghost" title="设置" aria-label="设置">⚙</button>
    </header>

    <div id="arena">
    <section id="shopZone" class="zone zone-shop">
      <div class="zone-label" id="shopLabel">酒馆</div>
      <div class="row" id="shopRow"></div>
    </section>

    <div class="phase-divider"><span id="phaseTitle"></span></div>
    <section id="boardZone" class="zone zone-board">
      <div class="zone-label" id="boardLabel"></div>
      <div class="row" id="boardRow"></div>
    </section>

    </div>
    <section id="heroBar">
      <div id="heroPortrait" class="hero-portrait"></div>
      <button id="btnPower" class="power-btn"></button>
      <div id="trinketBox" class="trinket-box"></div>
      <div id="goldBox" class="gold-box"></div>
      <div class="bar-spacer"></div>
      <div id="combatCtl" class="bar-group" hidden>
        <button id="btnSpeed" class="btn">速度 1×</button>
        <button id="btnSkip" class="btn">跳过</button>
      </div>
      <button id="btnEnd" class="btn-end" title="结束回合 (空格)">结束回合</button>
    </section>

    <section id="handZone" class="zone zone-hand">
      <div class="zone-label" id="handLabel"></div>
      <div class="row hand" id="handRow"></div>
    </section>

    <div id="targetBanner" class="target-banner" hidden></div>
    <div id="resultBanner" class="result-banner" hidden></div>
  </main>
</div>

<div id="actPop" class="act-pop" hidden></div>
<div id="tip" class="tip" hidden></div>
<div id="fx" aria-hidden="true"></div>
<div id="modal" class="modal" hidden><div class="modal-card" id="modalBody"></div></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/sfx.js"></script>
<script src="js/art.js"></script>
<script src="js/combat-fx.js"></script>
<script src="js/ui.js"></script>
<script src="js/net.js"></script>
<script src="js/online.js"></script>
</body>
</html>
